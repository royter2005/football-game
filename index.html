<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060913; }
</style>
</head>
<body>
  <script>
    // Скачиваем игру по твоей ссылке и запускаем её прямо в браузере
    fetch('https://gist.githubusercontent.com/royter2005/ff1f608e759a5dfe016daa14b214a2b6/raw/84ac9c20a515a412e49d5609e04380c4c54d7179/football.js')
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = "<h1 style='color:white; padding:20px;'>Ошибка загрузки игры: " + err + "</h1>";
      });
  </script>
</body>
</html>
